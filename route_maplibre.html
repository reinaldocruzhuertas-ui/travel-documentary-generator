        color: 'green'

        color: 'red'
    })
    .setLngLat(end)
    .setPopup(
        new maplibregl.Popup()
            .setHTML('<b>Tunja</b>')
    )
    .addTo(map);

    // Auto zoom to route
    const bounds = new maplibregl.LngLatBounds();

    routeCoordinates.forEach(coord => {
        bounds.extend(coord);
    });

    map.fitBounds(bounds, {
        padding: 50
    });

});
